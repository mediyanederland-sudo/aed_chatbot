<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AED Leader Admin · Sign in</title>
<style>
  /* Brand variables — taken verbatim from frontend/css/chatbot.css so the
     dashboard matches the widget exactly. */
  :root {
    --aed-primary:        #0B5ED7;
    --aed-primary-dk:     #0950b8;
    --aed-primary-light:  rgba(11, 94, 215, 0.08);
    --aed-primary-glow:   rgba(11, 94, 215, 0.18);
    --aed-accent:         #198754;
    --aed-sale:           #dc3545;
    --aed-sale-bg:        rgba(220, 53, 69, 0.08);
    --aed-black:          #1a1a1a;
    --aed-text:           #1a1a1a;
    --aed-text-secondary: #555;
    --aed-muted:          #6b7280;
    --aed-bg:             #f5f6f8;
    --aed-bg-alt:         #eef0f3;
    --aed-card:           #ffffff;
    --aed-border:         #e5e7eb;
    --aed-radius:         16px;
    --aed-radius-sm:      10px;
    --aed-shadow:         0 8px 32px rgba(0, 0, 0, 0.15);
    --aed-shadow-sm:      0 2px 8px rgba(0, 0, 0, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    /* Same system font stack as the widget — no Google Fonts roundtrip */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--aed-text);
    background: linear-gradient(135deg, #eef3fc 0%, #f5f6f8 100%);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--aed-card);
    border: 1px solid var(--aed-border);
    border-radius: var(--aed-radius);
    box-shadow: var(--aed-shadow);
    width: 100%;
    max-width: 400px;
    padding: 36px 32px 28px;
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    background: var(--aed-primary);
    color: #fff;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(11, 94, 215, 0.35);
  }
  .brand-mark svg { display: block; }
  h1 {
    font-size: 17px; font-weight: 700;
    color: var(--aed-text);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--aed-muted);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--aed-text-secondary);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    border: 1.5px solid var(--aed-border);
    border-radius: var(--aed-radius-sm);
    background: var(--aed-card);
    color: var(--aed-text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    border-color: var(--aed-primary);
    box-shadow: 0 0 0 3px var(--aed-primary-light);
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 22px;
    padding: 12px 18px;
    background: var(--aed-primary);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    /* Pill — matches the widget's chat-toggle button */
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(11, 94, 215, 0.25);
  }
  button[type="submit"]:hover:not([disabled]) {
    background: var(--aed-primary-dk);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(11, 94, 215, 0.35);
  }
  button[type="submit"]:active { transform: translateY(0); }
  button[type="submit"][disabled] { opacity: 0.6; cursor: not-allowed; }

  .error {
    margin-top: 14px;
    padding: 11px 14px;
    background: var(--aed-sale-bg);
    border: 1px solid rgba(220, 53, 69, 0.22);
    color: var(--aed-sale);
    border-radius: var(--aed-radius-sm);
    font-size: 12.5px;
    font-weight: 500;
    display: none;
  }
  .error.show { display: block; }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--aed-muted);
    letter-spacing: 0.02em;
  }
  .footer a { color: var(--aed-primary); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <form class="card" id="loginForm" autocomplete="off">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <!-- Medical heart — same visual language as a defibrillator/AED -->
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h1>AED Leader Admin</h1>
        <div class="sub">Sign in to view conversations</div>
      </div>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username" autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit" id="submitBtn">Sign in</button>

      <div class="error" id="errorBox"></div>

      <div class="footer">
        <a href="https://www.aedleader.com" target="_blank" rel="noopener">aedleader.com</a> · admin v1.0
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }
    function clearError() {
      errorBox.classList.remove('show');
      errorBox.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });
        if (resp.ok) {
          window.location.href = '/admin';
          return;
        }
        if (resp.status === 401) {
          showError('Invalid username or password.');
        } else if (resp.status === 422) {
          showError('Username and password are required.');
        } else if (resp.status === 429) {
          showError('Too many login attempts. Try again later.');
        } else {
          showError('Login failed (HTTP ' + resp.status + ').');
        }
      } catch (err) {
        showError('Network error. Check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
